name: Release Version

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (leave blank to auto-detect from CMakeLists.txt)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-macos:
    name: Package (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        run: |
          brew install qt cmake ninja

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build ApexCluster
        run: |
          cmake --build build --config Release

      - name: Package macOS App
        run: |
          cd build
          zip -r ApexCluster-macOS.zip ApexCluster.app

      - name: Upload macOS Asset
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: build/ApexCluster-macOS.zip

  build-linux:
    name: Package (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libvulkan-dev

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build ApexCluster
        run: |
          cmake --build build --config Release

      - name: Package Linux Binary
        run: |
          cd build
          tar -czf ApexCluster-Linux.tar.gz ApexCluster

      - name: Upload Linux Asset
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: build/ApexCluster-Linux.tar.gz

  build-windows:
    name: Package (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Setup MSVC Developer Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build ApexCluster (Windows)
        run: |
          cmake --build build --config Release

      - name: Package Windows Binary
        shell: pwsh
        run: |
          Compress-Archive -Path build/ApexCluster.exe -DestinationPath build/ApexCluster-Windows.zip

      - name: Upload Windows Asset
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: build/ApexCluster-Windows.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Version
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            DETECTED=$(grep -oE "VERSION [0-9]+\.[0-9]+\.[0-9]+" CMakeLists.txt | head -n 1 | awk '{print "v"$2}')
            TAG="${DETECTED:-v1.2.1}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Selected release tag: $TAG"

      - name: Download macOS Asset
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist

      - name: Download Linux Asset
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist

      - name: Download Windows Asset
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: "APEX Cluster ${{ steps.version_step.outputs.tag }}"
          body: |
            ## APEX EV Digital Instrument Cluster & ECU Simulation Suite (${{ steps.version_step.outputs.tag }})

            Automotive digital instrument cluster and hardware-in-the-loop (HIL) ECU simulation suite built natively with **Qt 6 / QML** and **C++17**.

            ### Download Pre-Compiled Packages

            | Platform | File | Description |
            |:---|:---|:---|
            | **macOS** (14 Sonoma / 15 Sequoia) | `ApexCluster-macOS.zip` | Standalone `.app` bundle |
            | **Linux** (Ubuntu 22.04 / 24.04) | `ApexCluster-Linux.tar.gz` | Native 64-bit ELF binary |
            | **Windows** (10 / 11 64-bit) | `ApexCluster-Windows.zip` | Native MSVC `.exe` binary |

            ---

            ### What's Included in this Build

            * **Interactive Automotive Map Navigation Engine**: Real-time CartoDB / OSM slippy map engine with Spherical Mercator projections, pin placement (Set Start and Set Dest), 5 global route presets, and route polyline rendering.
            * **Native C++ Navigation Controller**: Asynchronous OSRM REST client, procedural fallback routing, cruise simulation, and telemetry interpolation.
            * **Cluster HUD Streaming**: Turn-by-turn maneuvers, countdowns, ETA, and 16-point dynamic compass bearings directly synchronized with the digital instrument cluster.
            * **Multi-Platform CI & Release Pipelines**: Fully automated compilation and static QML verification across macOS (Clang), Ubuntu Linux (GCC), and Windows (MSVC 2022 + Ninja).
            * **Automated Continuous Packaging**: Built and packaged automatically from GitHub main.
          files: |
            dist/ApexCluster-macOS.zip
            dist/ApexCluster-Linux.tar.gz
            dist/ApexCluster-Windows.zip
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
