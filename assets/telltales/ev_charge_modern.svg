<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="chargeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Energy Capsule Hex -->
  <path d="M 24 4 L 40 13.2 L 40 34.8 L 24 44 L 8 34.8 L 8 13.2 Z" 
        fill="none" 
        stroke="url(#chargeGrad)" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.85"/>
  <!-- Sharp Modern Dynamic Lightning Bolt -->
  <path d="M 27 7 L 14 25 L 23 25 L 19 41 L 34 22 L 25 22 Z" 
        fill="url(#chargeGrad)" 
        filter="url(#glow)"/>
</svg>
